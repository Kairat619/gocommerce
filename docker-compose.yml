services:
  db:
    image: postgres:16-alpine
    container_name: gocommerce-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gocommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gocommerce}
      POSTGRES_DB: ${POSTGRES_DB:-gocommerce}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gocommerce}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
